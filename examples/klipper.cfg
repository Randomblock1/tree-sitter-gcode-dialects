[include mainsail.cfg]
[include KAMP/*.cfg]

[gcode_macro CLEAN_NOZZLE]
description: Clean the nozzle with two wipes
variable_wipe_count: 2
gcode:
  {# park, then wipe across the brush pad #}
  {%- set wipe_count = params.COUNT|default(2)|int -%}
  SAVE_GCODE_STATE NAME=clean_nozzle_state
  G90
  G0 Z15 F300
  {% for wipe in range(wipe_count) %}
    {% for coordinate in [(275, 4), (235, 4)] %}
      G0 X{coordinate[0]} Y{coordinate[1] + 0.25 * wipe} Z9.7 F12000
    {% endfor %}
  {% endfor %}
  { action_respond_info("Completed %d wipes" % wipe_count) }
  RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro SET_PERCENT]
gcode:
  {% set value = params.VALUE|default(0.0)|float %}
  M117 Now at {value * 100}%

